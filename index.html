<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestão de Documentos</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <header>
    <h1>Gestão de Documentos</h1>
    <div style="display: flex; gap: 8px;">
      <button class="btn-header" onclick="document.getElementById('modal-cores').style.display='flex'">🎨 Personalizar Cores</button>
    </div>
  </header>

  <main>
    <!-- Formulário de Cadastro -->
    <section class="card-form">
      <h2>Novo Documento</h2>
      <form id="form-documento">
        <div style="display: flex; gap: 8px; align-items: center; width: 100%;">
          <select id="tipo" required style="flex: 1;">
            <option value="">Carregando tipos...</option>
          </select>
          <button type="button" onclick="document.getElementById('modal-tipos').style.display='flex'; renderizarListaTiposModal();" style="padding: 10px 14px; background: #475569; color: white; border: none; border-radius: 6px; cursor: pointer; white-space: nowrap; font-size: 0.85rem;">
            ⚙️ Gerenciar Tipos
          </button>
        </div>

        <input type="text" id="numero" placeholder="Identificador (ex: Ofício 12/2026)" required>
        <input type="text" id="origem" placeholder="Remetente / Origem" required>
        <textarea id="assunto" placeholder="Resumo do assunto" required></textarea>
        <input type="file" id="arquivo" accept=".pdf,.doc,.docx" required>
        <button type="submit">Cadastrar Documento</button>
      </form>
    </section>

    <!-- Modal: Gerenciar Tipos -->
    <div id="modal-tipos" class="modal-overlay">
      <div class="modal-content">
        <h3 style="margin-bottom: 16px; color: var(--primary);">Gerenciar Tipos de Documentos</h3>
        
        <div style="display: flex; gap: 8px; margin-bottom: 16px;">
          <input type="text" id="novo-tipo-nome" placeholder="Novo tipo (ex: Portaria)" style="flex: 1; padding: 8px; border: 1px solid #cbd5e1; border-radius: 6px;">
          <button type="button" onclick="adicionarNovoTipo()" style="padding: 8px 12px; background: var(--primary); color: white; border: none; border-radius: 6px; cursor: pointer;">Adicionar</button>
        </div>

        <ul id="lista-tipos" style="list-style: none; max-height: 200px; overflow-y: auto; padding: 0; margin-bottom: 16px; border-top: 1px solid #e2e8f0;"></ul>

        <div style="text-align: right;">
          <button type="button" onclick="document.getElementById('modal-tipos').style.display='none';" style="padding: 8px 16px; background: #e2e8f0; color: #334155; border: none; border-radius: 6px; cursor: pointer;">Fechar</button>
        </div>
      </div>
    </div>

    <!-- Modal: Personalizar Cores -->
    <div id="modal-cores" class="modal-overlay">
      <div class="modal-content">
        <h3 style="margin-bottom: 16px; color: var(--primary);">Paleta de Cores do Sistema</h3>
        <p style="font-size: 0.9rem; color: #64748b; margin-bottom: 16px;">Selecione a cor de sua preferência:</p>
        
        <div style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 20px;">
          <button onclick="mudarCorTema('#1e3a8a')" style="background: #1e3a8a; color: white; border: none; padding: 10px; border-radius: 6px; cursor: pointer; font-size: 0.85rem;">Azul Jurídico</button>
          <button onclick="mudarCorTema('#831843')" style="background: #831843; color: white; border: none; padding: 10px; border-radius: 6px; cursor: pointer; font-size: 0.85rem;">Bordô / Vinho</button>
          <button onclick="mudarCorTema('#065f46')" style="background: #065f46; color: white; border: none; padding: 10px; border-radius: 6px; cursor: pointer; font-size: 0.85rem;">Verde Floresta</button>
          <button onclick="mudarCorTema('#334155')" style="background: #334155; color: white; border: none; padding: 10px; border-radius: 6px; cursor: pointer; font-size: 0.85rem;">Cinza Grafite</button>
        </div>

        <div style="display: flex; align-items: center; gap: 10px; margin-bottom: 20px;">
          <label style="font-size: 0.9rem; color: #334155;">Ou selecione livremente:</label>
          <input type="color" id="cor-personalizada" onchange="mudarCorTema(this.value)" style="cursor: pointer; width: 40px; height: 35px; border: none; border-radius: 4px;">
        </div>

        <div style="text-align: right;">
          <button type="button" onclick="document.getElementById('modal-cores').style.display='none';" style="padding: 8px 16px; background: #e2e8f0; color: #334155; border: none; border-radius: 6px; cursor: pointer;">Concluir</button>
        </div>
      </div>
    </div>

    <!-- Modal: Editar Documento -->
    <div id="modal-editar-doc" class="modal-overlay">
      <div class="modal-content modal-body">
        <h3 style="margin-bottom: 16px; color: var(--primary);">Editar Documento</h3>
        <input type="hidden" id="edit-doc-id">
        
        <label style="font-size: 0.85rem; font-weight: 600; color: #475569;">Tipo</label>
        <select id="edit-tipo" style="margin-bottom: 12px;"></select>

        <label style="font-size: 0.85rem; font-weight: 600; color: #475569;">Identificador</label>
        <input type="text" id="edit-numero" style="margin-bottom: 12px;" required>

        <label style="font-size: 0.85rem; font-weight: 600; color: #475569;">Remetente / Origem</label>
        <input type="text" id="edit-origem" style="margin-bottom: 12px;" required>

        <label style="font-size: 0.85rem; font-weight: 600; color: #475569;">Assunto</label>
        <textarea id="edit-assunto" style="margin-bottom: 12px; min-height: 80px;" required></textarea>

        <label style="font-size: 0.85rem; font-weight: 600; color: #475569;">Status</label>
        <select id="edit-status" style="margin-bottom: 20px;">
          <option value="Registrado">Registrado</option>
          <option value="Em Andamento">Em Andamento</option>
          <option value="Concluído">Concluído</option>
        </select>

        <div style="display: flex; justify-content: flex-end; gap: 8px;">
          <button type="button" onclick="document.getElementById('modal-editar-doc').style.display='none';" style="padding: 8px 16px; background: #e2e8f0; color: #334155; border: none; border-radius: 6px; cursor: pointer;">Cancelar</button>
          <button type="button" onclick="salvarEdicaoDocumento()" style="padding: 8px 16px; background: var(--primary); color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: 600;">Salvar Alterações</button>
        </div>
      </div>
    </div>

    <!-- Tabela com Abas -->
    <section class="tabela-container">
      <h2>Documentos Registados</h2>

      <!-- Abas dos Tipos -->
      <div id="abas-tipos" class="tabs-container"></div>

      <table>
        <thead>
          <tr>
            <th>Tipo / Identificador</th>
            <th>Origem</th>
            <th>Assunto</th>
            <th>Data de Registo</th>
            <th>Status</th>
            <th>Ações</th>
          </tr>
        </thead>
        <tbody id="corpo-tabela">
          <tr><td colspan="6" style="text-align:center;">Carregando...</td></tr>
        </tbody>
      </table>
    </section>
  </main>

  <script src="js/supabase.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
