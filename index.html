<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestão de Documentos & Prazos</title>
  <link rel="stylesheet" href="css/style.css">
  <!-- SDK oficial do Supabase via CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <header>
    <h1>Gestão de Documentos & Prazos</h1>
  </header>

  <main>
    <section class="card-form">
      <h2>Novo Documento</h2>
      <form id="form-documento">
        <div style="display: flex; gap: 8px; align-items: center; width: 100%;">
          <select id="tipo" required style="flex: 1;">
            <option value="">Carregando tipos...</option>
          </select>
          <button type="button" id="btn-abrir-modal-tipos" style="padding: 10px 14px; background: #475569; color: white; border: none; border-radius: 6px; cursor: pointer; white-space: nowrap; font-size: 0.85rem;">
            ⚙️ Gerenciar Tipos
          </button>
        </div>

        <input type="text" id="numero" placeholder="Identificador (ex: Ofício 12/2026)" required>
        <input type="text" id="origem" placeholder="Remetente / Origem" required>
        <textarea id="assunto" placeholder="Resumo do assunto" required></textarea>
        <input type="file" id="arquivo" accept=".pdf,.doc,.docx" required>
        <button type="submit">Cadastrar Documento</button>
      </form>
    </section>

    <!-- Modal para Adicionar / Excluir Tipos -->
    <div id="modal-tipos" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 100; align-items: center; justify-content: center;">
      <div style="background: white; padding: 24px; border-radius: 12px; width: 90%; max-width: 450px; box-shadow: 0 10px 25px rgba(0,0,0,0.2);">
        <h3 style="margin-bottom: 16px; color: #1e3a8a;">Gerenciar Tipos de Documentos</h3>
        
        <div style="display: flex; gap: 8px; margin-bottom: 16px;">
          <input type="text" id="novo-tipo-nome" placeholder="Nome do novo tipo (ex: Portaria)" style="flex: 1; padding: 8px; border: 1px solid #cbd5e1; border-radius: 6px;">
          <button type="button" id="btn-adicionar-tipo" style="padding: 8px 12px; background: #1e3a8a; color: white; border: none; border-radius: 6px; cursor: pointer;">Adicionar</button>
        </div>

        <ul id="lista-tipos" style="list-style: none; max-height: 200px; overflow-y: auto; padding: 0; margin-bottom: 16px; border-top: 1px solid #e2e8f0;">
          <!-- Itens carregados via JS -->
        </ul>

        <div style="text-align: right;">
          <button type="button" id="btn-fechar-modal-tipos" style="padding: 8px 16px; background: #e2e8f0; color: #334155; border: none; border-radius: 6px; cursor: pointer;">Fechar</button>
        </div>
      </div>
    </div>
    </section>

    <section class="tabela-container">
      <h2>Documentos Registados</h2>
      <table>
        <thead>
          <tr>
            <th>Tipo / Número</th>
            <th>Origem</th>
            <th>Assunto</th>
            <th>Prazo</th>
            <th>Status</th>
            <th>Ações</th>
          </tr>
        </thead>
        <tbody id="corpo-tabela">
          <tr><td colspan="6" style="text-align:center;">A carregar...</td></tr>
        </tbody>
      </table>
    </section>
  </main>

  <!-- Ordem rigorosa dos scripts -->
  <script src="js/supabase.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
